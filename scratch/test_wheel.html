<!DOCTYPE html>
<html>
<head>
<style>
  .wheel {
    position: relative;
    width: 384px;
    height: 384px;
    border-radius: 50%;
    border: 1px solid #334155;
    margin: 100px auto;
  }
  .node {
    position: absolute;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: red;
    transform: translate(-50%, -50%);
  }
</style>
</head>
<body>
  <div class="wheel" id="w">
  </div>
  <script>
    const w = document.getElementById('w');
    for(let i=0; i<7; i++){
      const angle = (i * (360 / 7)) - 90;
      const radius = 50; 
      const x = 50 + radius * Math.cos(angle * (Math.PI / 180));
      const y = 50 + radius * Math.sin(angle * (Math.PI / 180));
      const node = document.createElement('div');
      node.className = 'node';
      node.style.left = x + '%';
      node.style.top = y + '%';
      w.appendChild(node);
    }
  </script>
</body>
</html>
